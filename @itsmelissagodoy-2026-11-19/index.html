<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Melissa Godoy · Ficha de creador · Datalítica</title>
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="description" content="Ficha de desempeño de @itsmelissagodoy en Instagram: alcance, contenido y audiencia.">
<meta property="og:type" content="website">
<meta property="og:title" content="Melissa Godoy · Ficha de creador">
<meta property="og:description" content="Alcance, contenido y audiencia de @itsmelissagodoy en Instagram, con datos públicos. Hecha por Datalítica.">
<meta property="og:url" content="https://scorecard.datalitica.com.co/@itsmelissagodoy-2026-11-19/">
<meta name="twitter:card" content="summary">
<meta property="og:image" content="https://scorecard.datalitica.com.co/@itsmelissagodoy-2026-11-19/avatar.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap">
<style>
:root{
  --papel:#FFFFFF; --banda:#F1F5FA; --tinta:#16243A; --tinta2:#3E4A5C; --tenue:#6A7585; --linea:#DCE3EC;
  --azul:#2F6FB5;   /* sin marca · Datalítica */
  --naranja:#D9822B;/* con marca */
  --pos:#138A60; --neu:#B8BFC9; --neg:#C2361B;
  --f:"Bricolage Grotesque",system-ui,"Segoe UI",sans-serif;
  --ancho:1240px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:76px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{background:var(--papel);color:var(--tinta);font:400 16px/1.55 var(--f);font-optical-sizing:auto;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
.ic{display:inline-flex;margin-right:.35em;vertical-align:-.16em}
.ic svg{width:1.08em;height:1.08em}
.wrap{max-width:var(--ancho);margin:0 auto;padding:0 24px}
a{color:inherit}
:focus-visible{outline:3px solid var(--azul);outline-offset:2px;border-radius:4px}

/* ---------- barra fija */
.barra{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--linea)}
.barra .wrap{display:flex;align-items:center;gap:20px;height:60px}
.barra .logo{height:26px;flex:none}
.barra nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1}
.barra nav::-webkit-scrollbar{display:none}
.barra nav a{text-decoration:none;font-size:14.5px;font-weight:500;color:var(--tinta2);padding:7px 11px;border-radius:8px;white-space:nowrap}
.barra nav a:hover{background:var(--banda);color:var(--tinta)}
.barra nav a.on{color:var(--tinta);font-weight:700}
.redes{display:flex;background:var(--banda);border-radius:10px;padding:3px;flex:none}
.redes button{border:0;background:transparent;font:600 13.5px var(--f);color:var(--tinta2);padding:6px 12px;border-radius:8px;cursor:pointer}
.redes button .ic{margin:0;font-size:17px;vertical-align:-.2em}
.redes button[aria-pressed="true"]{background:#fff;color:var(--tinta);box-shadow:0 1px 3px rgba(22,36,58,.12)}

/* ---------- portada */
.portada{padding:56px 0 44px}
.portada .wrap{display:grid;grid-template-columns:168px 1fr;gap:36px;align-items:center}
.foto{width:168px;height:168px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 6px var(--banda)}
.portada .quien{font-size:15px;color:var(--tenue)}
.arroba{color:var(--azul);font-weight:600;text-decoration:none}
.arroba:hover{text-decoration:underline}
.portada h1{font-size:clamp(34px,5.2vw,58px);line-height:1.02;font-weight:800;letter-spacing:-.03em;margin:4px 0 14px;font-variation-settings:"opsz" 96}
.portada .lema{font-size:clamp(18px,2.2vw,22px);line-height:1.4;color:var(--tinta2);max-width:36ch}
.cuentas{display:flex;flex-wrap:wrap;gap:22px;margin-top:22px}
.cuenta{display:flex;flex-direction:column}
.cuenta b{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.cuenta span{font-size:14px;color:var(--tenue)}
.cuenta.total b{color:var(--azul)}
.cuenta b .ic{font-size:22px;margin-right:.3em;vertical-align:-.1em}

/* ---------- capítulos */
.cap{padding:64px 0}
.cap.banda{background:var(--banda)}
.cap h2{font-size:clamp(26px,3.4vw,38px);line-height:1.12;font-weight:700;letter-spacing:-.025em;font-variation-settings:"opsz" 72}
.cap .bajada{font-size:17.5px;color:var(--tinta2);margin-top:12px}
.ancho h2{max-width:none}
.ancho .bajada{max-width:none;font-size:20px;font-weight:600;color:var(--tinta);margin-top:10px}
.cap .cuerpo{margin-top:34px}
.nota{font-size:13.5px;color:var(--tenue);margin-top:14px;max-width:70ch}

/* formato 1 · cada video es un punto */
.alcance{display:grid;grid-template-columns:1fr 220px;gap:36px;align-items:start}
.cifras{display:grid;gap:22px;border-left:2px solid var(--linea);padding-left:24px}
.cifra b{display:block;font-size:34px;font-weight:700;letter-spacing:-.025em;line-height:1}
.cifra > span{display:block;font-size:14.5px;color:var(--tinta2);margin-top:6px;line-height:1.35}
/* alcance con 1 red (A): cifras en una franja y gráfico a todo el ancho */
.franja-cifras{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));border-top:2px solid var(--tinta);margin-bottom:30px}
.franja-cifras .cifra{padding:16px 20px 4px 0}
.franja-cifras .cifra + .cifra{padding-left:20px;border-left:1px solid var(--linea)}
.franja-cifras .cifra > span{max-width:24ch}
.franja-cifras .det{display:block;margin-top:2px}
.franja-cifras.pie{margin:26px 0 0;border-top:1px solid var(--linea)}
/* alcance con varias redes (C): una franja por red */
.carriles-filas{border-top:2px solid var(--tinta)}
.carril{display:grid;grid-template-columns:250px 1fr;gap:24px;align-items:center;border-bottom:1px solid var(--linea);padding:10px 0}
.carril > svg{width:100%;height:auto;display:block;overflow:visible}
.carril-dato{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center}
.carril-dato .carril-ico{grid-row:1/3;grid-column:1;align-self:start;width:36px;height:36px;border-radius:10px;display:grid;place-items:center}
.carril-dato b{grid-column:2}
.carril-ico svg{width:20px;height:20px}
.carril-dato b{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.carril-dato span{font-size:13.5px;color:var(--tinta2);line-height:1.35;grid-column:2}
figure.puntos{position:relative}
figure.puntos > svg{width:100%;height:auto;display:block;overflow:visible}
.ley{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:14px;color:var(--tinta2);margin-bottom:10px}
.ley i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:7px;vertical-align:-1px}
.ley .sep{width:1px;background:var(--linea);align-self:stretch}
.ley .ayuda{margin-left:auto;color:var(--tenue);font-size:13px}
.pt{cursor:pointer}
.pt:hover circle:first-child,.pt:focus circle:first-child{stroke:var(--tinta);stroke-width:2.5}
.tip{position:absolute;z-index:5;pointer-events:none;width:300px;display:grid;grid-template-columns:96px 1fr;gap:12px;background:#fff;color:var(--tinta);font-size:13.5px;line-height:1.4;padding:10px;border-radius:14px;box-shadow:0 10px 30px rgba(22,36,58,.22);opacity:0;transform:translate(-50%,calc(-100% - 16px));transition:opacity .12s}
.tip.on{opacity:1}
.tip .tp-img{aspect-ratio:4/5;border-radius:9px;overflow:hidden;background:#24426B;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;padding:8px;line-height:1.2}
.tip .tp-img img{width:calc(100% + 16px);height:calc(100% + 16px);margin:-8px;object-fit:cover;display:block}
.tip .tp-meta{font-size:12.5px;color:var(--tenue)}
.tip .tp-st{display:flex;gap:10px;align-items:center;font-weight:700;font-size:14px;margin:4px 0}
.tip .tp-st span{display:inline-flex;align-items:center;gap:4px}
.tip .tp-st svg{width:13px;height:13px}
.tip .tp-h{font-weight:600}
.tip .tp-m{font-size:12.5px;color:#8A4A0E;font-weight:700;margin-top:4px}

/* formato 2 · mosaico de contenido */
.mosaico{display:flex;gap:3px;height:230px;border-radius:14px;overflow:hidden}
.tesela{position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:16px;color:#fff;min-width:0}
.tesela .t{font-size:16px;font-weight:700;line-height:1.2}
.tesela .p{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1}
.tesela .d{font-size:13px;opacity:.85}
.tesela.estrella{box-shadow:inset 0 0 0 3px #fff}
.sello-estrella{display:inline-block;margin-top:8px;background:#fff;color:var(--tinta);font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}

/* formato 3 · marcas a todo el ancho */
.franja{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:2px solid var(--tinta);border-bottom:1px solid var(--linea)}
.franja div{padding:16px 18px 16px 0}
.franja div+div{padding-left:18px;border-left:1px solid var(--linea)}
.franja b{display:block;font-size:30px;font-weight:700;letter-spacing:-.025em;line-height:1.05}
.franja span{display:block;font-size:14px;color:var(--tinta2);margin-top:4px;line-height:1.35}
.franja .acento b{color:#B4610F}
.franja b.txt{font-size:21px;line-height:1.15}
.fichas-marca{display:flex;gap:8px;flex-wrap:wrap;margin:26px 0 18px}
.fichas-marca button{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--linea);background:#fff;border-radius:999px;padding:7px 14px;font:600 14.5px var(--f);color:var(--tinta);cursor:pointer}
.fichas-marca button small{font-weight:500;color:var(--tenue)}
.fichas-marca button[aria-pressed="true"]{background:var(--tinta);border-color:var(--tinta);color:#fff}
.fichas-marca button[aria-pressed="true"] small{color:#C9D3E0}
.piezas{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px}
.pieza{display:grid;grid-template-columns:104px 1fr;gap:12px 14px;align-content:start;background:#fff;border-radius:16px;padding:12px;border:1px solid var(--linea)}
.pieza .portada-p{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:4/5;background:#24426B;align-self:start}
.pieza .portada-p img{width:100%;height:100%;object-fit:cover;display:block}
.pieza .portada-p .sin-img{position:absolute;inset:0;display:flex;align-items:center;padding:10px;color:#fff;font-size:14px;font-weight:700;line-height:1.2}
.red-n{font-weight:700}
.pieza .meta{font-size:13px;color:var(--tenue);display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.pieza .stats{display:flex;gap:14px;margin:6px 0 8px;font-size:15px;font-weight:700;align-items:center;flex-wrap:wrap}
.pieza .stats span{display:inline-flex;align-items:center;gap:5px}
.pieza .hallazgo{font-size:15.5px;font-weight:600;line-height:1.35;color:var(--tinta)}
.pieza ol{grid-column:1/-1;list-style:none;margin-top:2px;display:grid;gap:6px;border-top:1px solid var(--linea);padding-top:10px}
.pieza li{font-size:13.5px;line-height:1.4;color:var(--tinta2);display:grid;grid-template-columns:auto 1fr;gap:8px}
.pieza li .lk{font-weight:700;color:var(--tinta);font-size:12.5px;min-width:34px;white-space:nowrap}
.pieza li.com-t{display:block;font-size:12.5px;color:var(--tenue);font-weight:600}
.emo{font-size:18px;line-height:1;cursor:help}
.st svg{width:15px;height:15px}

/* formato 4 · audiencia en una franja */
.aud{display:grid;gap:32px;align-items:start}
.aud h3{font-size:15px;font-weight:700;margin-bottom:12px;color:var(--tinta2)}
.bal-fila{display:grid;gap:5px;margin-bottom:14px}
.bal-fila .r{font-size:14px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.bal-fila .r small{font-weight:400;color:var(--tenue);font-size:13px}
.barra100{display:flex;height:30px;gap:2px;border-radius:8px;overflow:hidden}
.barra100 span{display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;white-space:nowrap;min-width:0;overflow:hidden}
.barra100 .neu{color:var(--tinta)}
.ley-bal{display:flex;gap:14px;font-size:13px;color:var(--tinta2);flex-wrap:wrap}
.ley-bal i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.temas{display:grid;gap:9px}
.tema{display:grid;grid-template-columns:1fr 40px;gap:2px 10px;align-items:center;font-size:14px}
.tema .b{grid-column:1/-1;height:8px;border-radius:0 4px 4px 0;background:var(--tinta)}
.tema .pc{text-align:right;font-weight:600}
.dicen{display:grid;gap:8px}
.globo{background:var(--banda);border-radius:14px 14px 14px 4px;padding:10px 13px;font-size:14.5px;line-height:1.4}
.globo small{display:block;font-size:12px;color:var(--tenue);margin-top:4px}
.dato-marca{margin-top:18px;padding-top:14px;border-top:1px solid var(--linea)}
.dato-marca b{font-size:34px;font-weight:700;color:#B4610F;letter-spacing:-.03em;line-height:1}
.dato-marca p{font-size:14.5px;color:var(--tinta2);margin-top:4px}

/* formato 5 · galería */
.galeria{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.video{display:block;text-decoration:none;color:inherit}
.video .img{aspect-ratio:4/5;border-radius:12px;overflow:hidden;background:var(--tinta);position:relative}
.video img{width:100%;height:100%;object-fit:cover;display:block}
.video .sin-img{position:absolute;inset:0;display:flex;align-items:center;padding:60px 14px 14px;color:#fff;font-size:17px;font-weight:700;line-height:1.2;background:#24426B}
.video .sobre{position:absolute;left:8px;right:8px;top:8px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.video .sobre span{display:inline-flex;align-items:center;gap:4px;background:rgba(22,36,58,.84);color:#fff;font-weight:700;font-size:13px;padding:3px 8px;border-radius:999px}
.video .sobre .emo{background:#fff;font-size:15px;padding:2px 6px;margin-left:auto}
.video .sobre svg{width:12px;height:12px}
.video .pie{margin-top:8px;font-size:13.5px;color:var(--tinta2);line-height:1.35}
.video .pie b{color:var(--tinta);font-weight:600}
.video .pie em{display:block;font-style:normal;color:var(--tinta);margin-top:3px}
.video:hover .img{box-shadow:0 0 0 3px var(--azul)}

/* firma */
.firma{padding:56px 0 64px;border-top:1px solid var(--linea)}
.firma .wrap{display:grid;grid-template-columns:auto 1fr auto;gap:32px;align-items:center}
.firma img{height:52px}
.firma .firma-t{font-size:15.5px;color:var(--tinta2);max-width:58ch}
.contacto{display:grid;gap:8px;justify-items:start;padding:18px 20px;border-radius:14px;background:var(--banda)}
.contacto .ct-t{font-size:17px;font-weight:700;color:var(--tinta)}
.ct-wa{background:#1F8F55;color:#fff;text-decoration:none;font-weight:700;font-size:15px;padding:9px 14px;border-radius:10px}
.ct-wa:hover{background:#17724A}
.ct-mail{color:var(--azul);font-weight:600;font-size:15px}
.firma .legal{grid-column:1/-1;font-size:12.5px;color:var(--tenue)}
.pdf{background:var(--tinta);color:#fff;border:0;border-radius:10px;padding:12px 18px;font:600 15px var(--f);cursor:pointer;white-space:nowrap}
.pdf:hover{background:var(--azul)}

/* ---------- móvil */
@media screen and (max-width:1100px){.galeria{grid-template-columns:repeat(3,1fr)}.aud{grid-template-columns:1fr 1fr!important}}
@media screen and (max-width:820px){
  .barra .wrap{height:auto;flex-wrap:wrap;gap:8px 12px;padding:10px 16px}
  .barra nav{order:3;flex-basis:100%}
  .barra .redes{margin-left:auto}
  .wrap{padding:0 16px}
  .portada .wrap{grid-template-columns:1fr;gap:20px}
  .foto{width:112px;height:112px}
  .alcance{grid-template-columns:1fr;gap:30px}
  .franja-cifras{grid-template-columns:1fr 1fr}
  .franja-cifras .cifra{padding:14px 12px 4px 0}
  .franja-cifras .cifra + .cifra{padding-left:0;border-left:0}
  .franja-cifras .cifra:nth-child(even){padding-left:14px;border-left:1px solid var(--linea)}
  .franja-cifras .cifra b{font-size:28px}
  .carril{grid-template-columns:1fr;gap:6px;padding:14px 0}
  .aud{grid-template-columns:1fr!important;gap:30px}
  .piezas{grid-template-columns:1fr}
  .pieza{grid-template-columns:96px 1fr;gap:12px}
  .galeria{grid-template-columns:1fr 1fr}
  .franja div+div{padding-left:12px}
  .cifras{grid-template-columns:1fr 1fr;border-left:0;padding-left:0;border-top:2px solid var(--linea);padding-top:20px}
  .mosaico{flex-direction:column;height:auto}
  .tesela{flex-direction:row;align-items:center;gap:12px;padding:12px 14px;flex:none!important;min-height:56px}
  .tesela .p{font-size:22px;order:-1;min-width:58px}
  .tesela .d{margin-left:auto;text-align:right}
  .sello-estrella{position:static}
  .bal-fila{grid-template-columns:1fr}
  .ley-bal{margin-left:0}
  .galeria{grid-template-columns:1fr 1fr;gap:12px}
  .firma .wrap{grid-template-columns:1fr}
  .cap{padding:48px 0}
}
@page{size:1280px 1810px;margin:0}
@media print{
  .barra{position:static}.barra nav,.redes,.pdf,.ley .ayuda,.tip,.fichas-marca,.contacto{display:none!important}
  .cap{padding:32px 0}
  figure.puntos,.mosaico,.franja{break-inside:avoid}
  .piezas,.galeria{display:block}
  .pieza{break-inside:avoid;margin-bottom:14px}
  .galeria .video{display:inline-block;width:15.4%;margin:0 1% 12px 0;vertical-align:top;break-inside:avoid}
  .cap h2{break-after:avoid}
  body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

/* ---------- modelo de cada vista (todas las redes o una) */
function vista(sc){
  const redes = sc==="todas" ? D.redes_orden : [sc];
  const A = redes.map(r => D.redes[r]);
  const posts = A.flatMap(a => a.publicaciones);
  const vids = posts.filter(p => p.reproducciones);
  const views = vids.reduce((s,p)=>s+p.reproducciones,0);
  const medAll = med(vids.map(p=>p.reproducciones));
  // categorías: participación en reproducciones e índice vs. la mediana de la vista
  const cats = {};
  posts.forEach(p => { const c = cats[p.categoria] ||= {nombre:p.categoria, n:0, v:0, vs:[]}; c.n++; c.v += p.reproducciones||0; if(p.reproducciones) c.vs.push(p.reproducciones); });
  const catL = Object.values(cats).filter(c=>c.nombre!=="Sin categoría").map(c=>({...c, share:c.v/views, idx: med(c.vs)/medAll})).sort((a,b)=>b.v-a.v);
  const estrella = catL.filter(c=>c.n>=3 && c.idx>=1.05 && !ESCONDER_TOP.has(c.nombre)).sort((a,b)=>b.idx-a.idx)[0];
  // marcas
  let marcas;
  if(sc==="todas") marcas = D.resumen.marcas.map(m => ({marca:m.marca, piezas:m.piezas_total, redes:Object.keys(m.por_red), v:m.reproducciones,
      idx:(D.redes.instagram?.marcas.find(x=>x.marca===m.marca)||{}).indice_reproducciones}));
  else marcas = A[0].marcas.map(m => ({marca:m.marca, piezas:m.publicaciones, redes:[sc], v:m.reproducciones, idx:m.indice_reproducciones}));
  const catsDe = {};
  posts.forEach(p => { if(p.marca) (catsDe[p.marca] ||= new Set()).add(p.categoria); });
  marcas.forEach(m => m.cats = [...(catsDe[m.marca]||[])].filter(c=>c!=="Sin categoría"));
  marcas.sort((a,b)=>b.piezas-a.piezas || b.v-a.v);
  const conMarca = posts.filter(p=>p.marca).length;
  // conversación
  const tono = {positivo:0, neutro:0, negativo:0}; let ntot=0; const temas={}; let nm=0, nmPI=0;
  const porRed = A.map(a => { const o=a.conversacion.organico, m=a.conversacion.marcas, t=o.total+m.total;
    const r={red:a.red, total:t, publicos:a.conversacion.comentarios_publicos, tono:{}};
    for(const k in tono){ r.tono[k] = t ? (o.tono[k]*o.total + m.tono[k]*m.total)/t : 0; tono[k] += r.tono[k]*t; }
    ntot += t;
    [o,m].forEach(c => c.temas.forEach(x => temas[x.nombre] = (temas[x.nombre]||0) + x.n));
    nm += m.total; nmPI += m.temas.filter(x=>["pregunta","intencion"].includes(x.tema)).reduce((s,x)=>s+x.n,0);
    return r; });
  for(const k in tono) tono[k] = ntot ? tono[k]/ntot : 0;
  const temaL = Object.entries(temas).filter(([k])=>!["Emojis y otros","Etiquetan a alguien"].includes(k)).map(([k,n])=>({k, p:100*n/ntot})).sort((a,b)=>b.p-a.p).slice(0,5);
  const ejemplos = [];
  const vistos = new Set();
  A.forEach(a => [...a.marcas.map(m=>({...m.conversacion, marca:m.marca})), ...a.categorias.map(c=>c.conversacion)].forEach(c => (c.ejemplos||[]).forEach(e => {
    if(["Elogio y antojo","Experiencia propia","Intención de compra o de probar","Hablan de la marca"].includes(e.tema) && e.texto.length>=24 && !vistos.has(e.texto) && !/\b(n[aã]o|essa|aqui|vou)\b/i.test(e.texto)){
      vistos.add(e.texto); ejemplos.push({...e, red:a.red}); } })));
  // lo más visto
  const fechasTop = new Set();   // el mismo video publicado en dos redes el mismo día aparece una sola vez
  const top = vids.filter(p=>!ESCONDER_TOP.has(p.categoria)).sort((a,b)=>b.reproducciones-a.reproducciones)
                  .filter(p => !fechasTop.has(p.fecha) && fechasTop.add(p.fecha)).slice(0,6);
  const tasaRed = A.filter(a=>a.organico.mediana_tasa).map(a=>({red:a.red, k:Math.round(1/a.organico.mediana_tasa)}));
  return {sc, redes, A, posts, vids, views, medAll, millon:vids.filter(p=>p.reproducciones>=1e6).length,
          catL, estrella, marcas, conMarca, porRed, tono, ntot, temaL, ejemplos:ejemplos.slice(0,3), ejemplosRed: redes.map(r=>({red:r, l:ejemplos.filter(e=>e.red===r).slice(0, redes.length>1?2:3)})).filter(x=>x.l.length), pi: nm? 100*nmPI/nm : null, top, tasaRed};
}

/* ---------- formato 1: cada video es un punto */
function puntos(V, ancho){
  // en celular el gráfico se dibuja a la mitad de ancho: así los rótulos y los puntos se leen a tamaño real
  const MOVIL = !PDF && matchMedia("(max-width: 600px)").matches;
  const W = MOVIL ? 380 : ancho ? 1180 : 760, H = MOVIL ? 280 : ancho ? 340 : 300, pl = MOVIL ? 46 : 56, pr=12, pt=10, pb=30;
  const t0=new Date(D.ventana.desde).getTime(), t1=new Date(D.ventana.hasta).getTime();
  const vmin=Math.max(1, Math.min(...V.vids.map(p=>p.reproducciones))), vmax=Math.max(...V.vids.map(p=>p.reproducciones));
  let lo=Math.log10(vmin*0.8), hi=Math.log10(vmax*1.15);
  if(hi-lo < 1){ const c=(hi+lo)/2; lo=c-0.5; hi=c+0.5; }   // pocos videos o todos parecidos: al menos un orden de magnitud
  const X = f => pl + (new Date(f).getTime()-t0)/(t1-t0)*(W-pl-pr);
  const Y = v => Math.min(H-pb, Math.max(pt, pt + (1-(Math.log10(Math.max(1,v))-lo)/(hi-lo))*(H-pt-pb)));   // nunca fuera del área

    const x=X(`${f.getFullYear()}-${String(f.getMonth()+1).padStart(2,"0")}-01`); g += `<line x1="${x}" x2="${x}" y1="${H-pb}" y2="${H-pb+5}" stroke="#B8BFC9"/><text x="${x+4}" y="${H-8}" font-size="12" fill="#6A7585">${MESES[f.getMonth()].slice(0,3)}</text>`; }
  const ord = [...V.vids].sort((a,b)=>(a.marca?1:0)-(b.marca?1:0));

      <circle class="dot" cx="${x}" cy="${y}" r="10.5" fill="${c}" stroke="#fff" stroke-width="1.5"/><circle cx="${x}" cy="${y}" r="14" fill="transparent"/></g>`; }).join("");

/* ---------- alcance con varias redes (alternativa C, aprobada por Kevin el 19-nov-2026):
   una franja por red sobre la misma línea de tiempo; cada red con sus propias cifras */
function rangoValor(r){
  const x = ((D.valor && D.valor.pauta) || {})[r];
  if(!x || !(x.cop_max > 0)) return null;
  const piso = x.minimo_cop || 0, a = Math.max(x.cop_min, piso), b = Math.max(x.cop_max, piso);
  if(b <= piso) return {t: pesos(piso), minimo: true};
  const u = v => v>=1e6 ? " M" : " mil", sin = v => pesos(v).slice(1).replace(/ (M|mil)$/, "");
  return {t: pesos(a) === pesos(b) ? pesos(b) : u(a) === u(b) ? `$${sin(a)}–${sin(b)}${u(b)}` : `${pesos(a)}–${pesos(b).slice(1)}`, minimo: false};
}
function hallazgoRedes(V){
  const tip = V.redes.map(r => ({r, t: D.redes[r].organico.mediana_reproducciones || 0})).sort((a,b)=>b.t-a.t)[0];
  const pico = [...V.vids].sort((a,b)=>b.reproducciones-a.reproducciones)[0];
  if(!pico) return "";
  return tip.r === pico.red
    ? `${RED_N[pico.red]} le da a la vez su video típico más alto (${fmt(tip.t)}) y su pico: ${largo(pico.reproducciones)}.`
    : `${RED_N[tip.r]} le da el video típico más alto (${fmt(tip.t)}); ${RED_N[pico.red]}, el pico: ${largo(pico.reproducciones)}.`;
}
function alcanceRedes(V){
  const MOVIL = !PDF && matchMedia("(max-width: 600px)").matches;
  const W = MOVIL ? 380 : 900, h = MOVIL ? 88 : 96, pl = 10, pr = 16, ext = 24;
  const t0=new Date(D.ventana.desde).getTime(), t1=new Date(D.ventana.hasta).getTime();
  const X = f => pl + (new Date(f).getTime()-t0)/(t1-t0)*(W-pl-pr);
  const vs = V.vids.map(p=>Math.max(1,p.reproducciones));
  let lo=Math.log10(Math.min(...vs)*0.7), hi=Math.log10(Math.max(...vs)*1.35);
  if(hi-lo < 1){ const c=(hi+lo)/2; lo=c-0.5; hi=c+0.5; }
  const Y = v => Math.min(h-8, Math.max(8, 8 + (1-(Math.log10(Math.max(1,v))-lo)/(hi-lo))*(h-16)));
  const hayMarca = V.vids.some(p=>p.marca);
  const filas = V.redes.map((r, i) => {
    const a = D.redes[r], ps = V.vids.filter(p=>p.red===r), ultima = i===V.redes.length-1, H = h + (ultima ? ext : 0);
    const tipico = a.organico.mediana_reproducciones, k = a.organico.mediana_tasa ? Math.round(1/a.organico.mediana_tasa) : null, val = rangoValor(r);
    let g = "";
    if(Math.log10(1e6) > lo && Math.log10(1e6) < hi)
      g += `<line x1="${pl}" x2="${W-pr}" y1="${Y(1e6)}" y2="${Y(1e6)}" stroke="#D3DBE5"/>` + (i===0 ? `<text x="${W-pr}" y="${Y(1e6)-5}" text-anchor="end" font-size="12" fill="#6A7585">1 millón</text>` : "");
    if(tipico) g += `<line x1="${pl}" x2="${W-pr}" y1="${Y(tipico)}" y2="${Y(tipico)}" stroke="${COLOR_RED[r]}" stroke-opacity=".4" stroke-dasharray="4 4"/>`;
    const d0=new Date(t0); for(let f=new Date(d0.getFullYear(), d0.getMonth()+1, 1); f.getTime()<=t1; f=new Date(f.getFullYear(), f.getMonth()+1, 1)){
      const x=X(`${f.getFullYear()}-${String(f.getMonth()+1).padStart(2,"0")}-01`);
      g += `<line x1="${x}" x2="${x}" y1="0" y2="${h}" stroke="#C9D2DD" stroke-dasharray="2 4"/>` + (ultima ? `<text x="${x+5}" y="${h+17}" font-size="12.5" fill="#6A7585">${MESES[f.getMonth()]}</text>` : ""); }
    const pts = [...ps].sort((a,b)=>(a.marca?1:0)-(b.marca?1:0)).map(p => { const x=X(p.fecha), y=Y(p.reproducciones);
      return `<g class="pt" data-i="${V.vids.indexOf(p)}" tabindex="0" role="button" aria-label="${fmt(p.reproducciones)} reproducciones, ${RED_N[p.red]}, ${fechaC(p.fecha)}">
        <circle class="dot" cx="${x}" cy="${y}" r="${MOVIL?6.5:8}" fill="${p.marca?"var(--naranja)":COLOR_RED[r]}" stroke="#fff" stroke-width="2"/><circle cx="${x}" cy="${y}" r="13" fill="transparent"/></g>`; }).join("");
    return `<div class="carril">
      <div class="carril-dato"><span class="carril-ico" style="background:${COLOR_RED[r]}">${ICONOS[r] ? `<svg viewBox="0 0 24 24" aria-hidden="true" style="color:#fff">${GLIFO_BLANCO[r] || ICONOS[r][1]}</svg>` : ""}</span>
        <b class="num">${tipico ? fmt(tipico) : "—"}</b>
        <span>${tipico ? `video típico en ${RED_N[r]}` : `${RED_N[r]}: sin reproducciones públicas`}<br>${ps.length} ${ps.length===1?"video":"videos"}${k?` · 1 de ${k} reacciona`:""}${val?`<br>${val.minimo?"mínimo ":"≈ "}${val.t} en publicidad`:""}</span></div>
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Reproducciones de cada video en ${RED_N[r]}">${g}${pts}</svg></div>`; }).join("");
  const masVisto = Math.max(...V.vids.map(p=>p.reproducciones));

      ${V.millon ? `<div class="cifra"><b class="num">${V.millon}</b><span>${V.millon===1?"video pasó":"videos pasaron"} el millón</span></div>`
                 : `<div class="cifra"><b class="num">${fmt(masVisto)}</b><span>reproducciones tuvo su video más visto</span></div>`}
      <div class="cifra"><b class="num">${fmt(V.medAll)}</b><span>reproducciones tiene un video típico suyo, sumando sus redes</span></div></div>`;
}

function valorPauta(V){
  const vp = (D.valor && D.valor.pauta) || {};
  const rs = V.redes.filter(r => vp[r] && vp[r].cop_max > 0);
  if(!rs.length) return "";
  return rs.map(r => { const x = vp[r], piso = x.minimo_cop || 0, en = MULTI ? " en "+ic(r) : "";
    const a = Math.max(x.cop_min, piso), b = Math.max(x.cop_max, piso);
    if(b <= piso) return `<div class="cifra"><b class="num">${pesos(piso)}</b><span>es el valor mínimo de referencia de una publicación suya${en}</span></div>`;
    const u = v => v>=1e6 ? " M" : " mil", sin = v => pesos(v).slice(1).replace(/ (M|mil)$/, "");
    const t = pesos(a) === pesos(b) ? pesos(b) : u(a) === u(b) ? `$${sin(a)}–${sin(b)}${u(b)}` : `${pesos(a)}–${pesos(b).slice(1)}`;   // $4,5–7,1 M · $250–385 mil
    return `<div class="cifra"><b class="num">${t}</b><span>costaría en publicidad el alcance de un video típico suyo${en}</span></div>`; }).join("");
}
function frecuencia(V){
  const semanas = D.ventana.dias/7, ritmo = n => n/semanas;
  const r = ritmo(V.posts.length);
  const n = r >= 7 ? r/7 : r, cuando = r >= 7 ? "al día" : "por semana";
  const cifra = `${dec(n,1).replace(/,0$/,"")} ${Math.round(n*10)===10?"video":"videos"}`;
  const det = MULTI && V.redes.length>1 ? V.redes.map(x=>`${ic(x)}${dec(ritmo(D.redes[x].publicaciones.length),1).replace(/,0$/,"")}`).join(" · ") : "";
  return `<div class="cifra"><b class="num">${cifra}</b><span>publica ${cuando}, en promedio${det?` <span class="det">(${det})</span>`:""}</span></div>`;
}

function balance(V, enRed){
  const fila = (lab, sub, t) => `<div class="bal-fila"><div class="r"><span>${lab}</span><small>${sub}</small></div><div class="barra100">
      <span style="flex:${t.positivo};background:var(--pos)">${pct(t.positivo)}</span><span class="neu" style="flex:${t.neutro};background:var(--neu)">${pct(t.neutro)}</span><span style="flex:${t.negativo};background:var(--neg)">${pct(t.negativo)}</span></div></div>`;
  const filas = V.porRed.length>1 ? V.porRed.map(r => fila(redTxt(r.red), nf.format(r.total)+" comentarios", r.tono)).join("") : fila(MULTI?redTxt(V.porRed[0].red):"Todos los comentarios", nf.format(V.ntot)+" comentarios", V.tono);
  const maxT = Math.max(...V.temaL.map(t=>t.p));
  const columnas = !MULTI || V.redes.length===1 || NREDES<=2;
  const escribe = columnas
    ? V.ejemplosRed.map(g => `<div><h3>Lo que escriben${MULTI?" en "+redColor(g.red):""}</h3><div class="dicen">${g.l.map(e=>`<p class="globo">${esc(e.texto)}</p>`).join("")}</div></div>`).join("")
    : `<div><h3>Lo que escriben</h3><div class="dicen">${V.ejemplosRed.map(g=>`<p class="globo">${esc(g.l[0].texto)}<small>${ic(g.red)}</small></p>`).join("")}</div></div>`;
  const nCols = 2 + (columnas ? V.ejemplosRed.length : 1);
  return `<h2>${titularAudiencia(V)}</h2>
    <p class="bajada">Leímos ${nf.format(V.ntot)} comentarios${enRed} y los ordenamos por tono y por tema.</p>
    <div class="aud cuerpo" style="grid-template-columns:repeat(${nCols},1fr)">
    <div><h3>Cómo se siente</h3>${filas}<div class="ley-bal"><span><i style="background:var(--pos)"></i>Positivos</span><span><i style="background:var(--neu)"></i>Neutros</span><span><i style="background:var(--neg)"></i>Negativos</span></div>
      ${V.pi>=8?`<div class="dato-marca"><b class="num">${pct(V.pi)}</b><p>de los comentarios en sus videos con marca preguntan por el producto o quieren probarlo.</p></div>`:""}</div>
    <div><h3>De qué habla</h3><div class="temas">${V.temaL.map(t=>`<div class="tema"><span>${esc(t.k)}</span><span class="pc num">${pct(t.p)}</span><span class="b" style="width:${100*t.p/maxT}%"></span></div>`).join("")}</div></div>
    ${escribe}
  </div>`;
}

function titularAudiencia(V){
  const t = k => (V.temaL.find(x=>x.k===k)||{p:0}).p;
  const pos = V.tono.positivo, neg = V.tono.negativo, pr = t("Preguntas") + t("Intención de compra o de probar");
  const top = V.temaL[0] ? V.temaL[0].k : "";
  if(pos >= 45) return `Su audiencia lo celebra: ${pct(pos)} de los comentarios son positivos.`;
  if(pr >= 15) return `Su audiencia pregunta y quiere probar: ${pct(pr)} de los comentarios piden detalles.`;
  if(top === "Humor") return `Su audiencia se ríe con él: el humor es lo que más comenta.`;
  if(top === "Elogio y antojo") return `Su audiencia lo elogia: es el tema que más se repite en sus comentarios.`;
  if(top === "Experiencia propia") return `Su audiencia se identifica: cuenta sus propias experiencias.`;
  if(neg >= 25) return `Su audiencia opina y debate: ${pct(neg)} de los comentarios son críticos.`;
  return `Esto es lo que dice su audiencia.`;
}

/* ---------- formato 5: galería */
function galeria(V){
  return `<div class="galeria">${V.top.map(p => { const src = portadaDe(p);
    return `<a class="video" href="${esc(p.url)}" target="_blank" rel="noopener"><div class="img">
      ${src?`<img src="${src}" alt="" ${PDF?"":`loading="lazy"`}>`:`<div class="sin-img">${esc(limpio(p.texto))}</div>`}
      <div class="sobre num"><span title="Reproducciones">${SVG_VER}${fmt(p.reproducciones)}</span><span title="Interacciones">${SVG_INT}${fmt(p.interacciones)}</span>${emoji(p.opinion)}</div></div>
      <p class="pie"><b>${esc(p.categoria)}</b>${p.marca?" con "+esc(p.marca):""} · ${redTxt(p.red)}${fechaC(p.fecha)}<em>${esc(p.hallazgo||"")}</em></p></a>`; }).join("")}</div>`;
}

/* ---------- página */
function pagina(sc){
  const V = vista(sc);
  const ig = D.redes.instagram;
  const enRed = (!MULTI || V.redes.length>1) ? "" : " en "+RED_N[sc];
  const seg = D.redes_orden.map(r=>({r, n:D.redes[r].perfil.seguidores})).filter(x=>x.n);
  const bio = ((ig||D.redes[D.redes_orden[0]]).perfil.bio||"").split("\n").map(l=>l.replace(/[^\p{L}\p{N}\s,.¡!¿?]/gu,"").replace(/\s+/g," ").trim().replace(/[.,]+$/,""))
                  .find(l => l.split(" ").length>=2 && l.replace(/[^\p{L}]/gu,"").length>=8) || "";
  const tasaTxt = V.tasaRed.map(t=>`1 de cada ${t.k} reacciona en ${RED_N[t.red]}${t.red==="tiktok"?" (con guardados)":""}`).join("; ");
  const est = V.estrella;
  document.getElementById("app").innerHTML = `
  <header class="barra"><div class="wrap">
    <img class="logo" src="${im("img/logo-datalitica.png")}" alt="Datalítica">
    <nav aria-label="Capítulos"><a href="#alcance">Alcance</a><a href="#contenido">Contenido</a><a href="#marcas">Marcas</a><a href="#audiencia">Audiencia</a><a href="#videos">Lo más visto</a></nav>
    ${MULTI?`<div class="redes" role="group" aria-label="Red social">${["todas",...D.redes_orden].map(r=>`<button type="button" data-sc="${r}" aria-pressed="${r===sc}" ${r==="todas"?"":`aria-label="${RED_N[r]}" title="${RED_N[r]}"`}>${r==="todas"?"Todas":ic(r)}</button>`).join("")}</div>`:""}
  </div></header>

  <section class="portada"><div class="wrap">
    <img class="foto" src="${im("img/avatar.jpg")}" alt="${esc(D.nombre)}" onerror="this.style.visibility='hidden'">
    <div><p class="quien"><a class="arroba" href="${esc((D.redes[D.redes_orden[0]].perfil||{}).url||"#")}" target="_blank" rel="noopener">@${esc(D.handle)}</a> · ${esc(D.nicho||"")} · ${esc(D.pais||"")}</p>
      <h1>${esc(D.nombre)}</h1>
      <p class="lema">${esc(bio || "Creador de contenido")}.</p>
      <div class="cuentas">${seg.length>1?`<div class="cuenta total"><b class="num">${fmt(seg.reduce((s,x)=>s+x.n,0))}</b><span>seguidores en total</span></div>`:""}
        ${seg.map(x=>`<div class="cuenta"><b class="num">${MULTI?ic(x.r):""}${fmt(x.n)}</b>${MULTI?"":"<span>seguidores</span>"}</div>`).join("")}</div>
    </div></div></section>

  <section class="cap banda" id="alcance"><div class="wrap ancho">
    ${V.redes.length > 1 ? `
    <h2>${hallazgoRedes(V)}</h2>
    <p class="bajada">${Cap(PERIODO.en)}, sus ${V.posts.length} ${V.posts.every(p=>/video|reel|short/i.test(p.tipo||"Video")) ? "videos" : "publicaciones"} sumaron ${conRep(V.views)}. Cada punto es un video; la línea punteada, su video típico en esa red.</p>
    <div class="cuerpo">${alcanceRedes(V)}</div>` : `
    <h2>${Cap(PERIODO.en)}, sus ${V.posts.length} ${V.posts.every(p=>/video|reel|short/i.test(p.tipo||"Video")) ? "videos" : "publicaciones"} sumaron ${conRep(V.views)}${enRed}.</h2>
    <p class="bajada">${V.millon===0?"Ninguno pasó el millón todavía.":V.millon===1?"Uno pasó el millón.":V.millon+" pasaron el millón."} Cada punto es un video: entre más alto, más se vio.</p>
    <div class="cuerpo">${alcanceUna(V)}</div>`}
    </div></section>

  <section class="cap" id="contenido"><div class="wrap">
    <h2>${est?`De todo lo que publica, «${esc(est.nombre)}» es lo que más se ve.`:"De qué habla y cuánto se ve cada tema."}</h2>
    <p class="bajada">${est?`Un video de ${esc(est.nombre.toLowerCase())} se ve ${dec(est.idx,2)} veces lo que se ve uno de sus videos típicos${enRed}.`:""}</p>
    <div class="cuerpo">${mosaico(V)}</div></div></section>

  <section class="cap banda" id="marcas"><div class="wrap">
    <h2>${marcasTitular(V)}</h2>
    <p class="bajada">${marcasBajada(V, enRed)}</p>
    <div class="cuerpo">${V.marcas.length?marcasHTML(V):temasHTML(V)}</div></div></section>

  <section class="cap" id="audiencia"><div class="wrap">${balance(V, enRed)}</div></section>

  <section class="cap banda" id="videos"><div class="wrap">
    <h2>Los videos que más se vieron.</h2>
    <p class="bajada">Encima de cada video: reproducciones, interacciones y cómo reaccionó la gente en los comentarios. Toca cualquiera para verlo.</p>
    <div class="cuerpo">${galeria(V)}</div></div></section>

  <footer class="firma"><div class="wrap">
    <img src="${im("img/logo-datalitica.png")}" alt="Datalítica">
    <p class="firma-t">Esta ficha la hizo Datalítica de forma independiente, con los datos públicos de ${D.redes_orden.map(r=>RED_N[r]).join(" y ")} de ${esc(nombre)} entre el ${fechaL(D.ventana.desde)} y el ${fechaL(D.ventana.hasta)}. Incluye todos sus videos y todas sus colaboraciones de ese periodo.</p>
    <div class="contacto"><p class="ct-t">¿Quieres una ficha como esta?</p>
      <a class="ct-wa" href="https://wa.me/${CONTACTO.wa}" target="_blank" rel="noopener">WhatsApp ${CONTACTO.tel}</a>
      <a class="ct-mail" href="mailto:${CONTACTO.correo}">${CONTACTO.correo}</a></div>
    <p class="legal">Datalítica Colombia S.A.S. · NIT 901.957.313-6 · Datos públicos tratados conforme a la Ley 1581 de 2012.</p>
  </div></footer>`;

  document.title = `${D.nombre} · Ficha de creador`;
  document.querySelectorAll(".redes button").forEach(b => b.addEventListener("click", () => { const y=scrollY; pagina(b.dataset.sc); scrollTo(0,y); }));
  document.querySelectorAll(".fichas-tema button").forEach(b => b.addEventListener("click", () => {
    TEMA_SEL = b.dataset.t;
    document.querySelectorAll(".fichas-tema button").forEach(x => x.setAttribute("aria-pressed", x===b));
    document.getElementById("panel-tema").innerHTML = temasPanel(V); }));
  document.querySelectorAll(".fichas-marca:not(.fichas-tema) button").forEach(b => b.addEventListener("click", () => {
    MARCA_SEL = b.dataset.m;
    document.querySelectorAll(".fichas-marca:not(.fichas-tema) button").forEach(x => x.setAttribute("aria-pressed", x===b));
    document.getElementById("panel-marca").innerHTML = marcasPanel(V); }));
  // tooltip del gráfico de puntos
  const fig = document.querySelector("figure.puntos"), tip = fig.querySelector(".tip");
  const show = el => { const p=V.vids[+el.dataset.i], r=el.getBoundingClientRect(), f=fig.getBoundingClientRect();
    const src = portadaDe(p);
    tip.innerHTML = `<div class="tp-img">${src?`<img src="${src}" alt="">`:esc(limpio(p.texto))}</div>
      <div><p class="tp-meta">${[redTxt(p.red)+fechaC(p.fecha), esc(p.categoria)].join(" · ")}</p>
        <p class="tp-st num"><span>${SVG_VER}${fmt(p.reproducciones)}</span><span>${SVG_INT}${fmt(p.interacciones)}</span>${p.opinion?`<span>${p.opinion.emoji}</span>`:""}</p>
        <p class="tp-h">${esc(p.hallazgo||"")}</p>${p.marca?`<p class="tp-m">Con ${esc(p.marca)}</p>`:""}</div>`;
    const cx = r.left+r.width/2-f.left, lim = 160;
    tip.style.left = Math.min(Math.max(cx, lim), f.width-lim)+"px"; tip.style.top = (r.top-f.top)+"px"; tip.classList.add("on"); };
  fig.querySelectorAll(".pt").forEach(el => { el.addEventListener("mouseenter",()=>show(el)); el.addEventListener("focus",()=>show(el));
    el.addEventListener("mouseleave",()=>tip.classList.remove("on")); el.addEventListener("blur",()=>tip.classList.remove("on"));
    const abrir = () => window.open(V.vids[+el.dataset.i].url, "_blank", "noopener");
    el.addEventListener("click", abrir); el.addEventListener("keydown", e => { if(e.key==="Enter") abrir(); }); });
  // capítulo activo en el menú
  const links=[...document.querySelectorAll(".barra nav a")];
  links.forEach(a => a.addEventListener("click", e => { e.preventDefault();
    const s = document.querySelector(a.getAttribute("href")); if(s) s.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}); }));
  const io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting) links.forEach(a=>a.classList.toggle("on", a.getAttribute("href")==="#"+e.target.id)); }),{rootMargin:"-45% 0px -50% 0px"});
  document.querySelectorAll(".cap").forEach(s=>io.observe(s));
}
pagina(MULTI ? "todas" : D.redes_orden[0]);
</script>
</body>
</html>
